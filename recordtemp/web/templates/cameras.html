{% extends "base.html" %}
{% block content %}
<div class="row" style="margin-bottom:12px">
  <h1 style="margin:0">カメラ・校正</h1><span class="spacer"></span>
  <button class="primary" id="add">＋ カメラを追加</button>
</div>
<div id="list" class="grid"></div>

<div class="card" id="formcard" style="display:none">
  <h2 id="formtitle">カメラを追加</h2>
  <div class="form-grid">
    <label>名前<input id="f_name" placeholder="例: リビング"></label>
    <label>IPアドレス<input id="f_host" placeholder="192.168.1.50"></label>
    <label>RTSPポート<input id="f_port" type="number" value="554"></label>
    <label>ストリーム<select id="f_stream"><option value="stream1">stream1（高画質 推奨）</option><option value="stream2">stream2（低画質）</option></select></label>
    <label>カメラアカウント ユーザー名<input id="f_username" autocomplete="off"></label>
    <label>カメラアカウント パスワード<input id="f_password" type="password" autocomplete="new-password" placeholder="変更しない場合は空欄"></label>
  </div>
  <details style="margin-top:12px"><summary class="small muted">詳細設定</summary>
    <div class="form-grid" style="margin-top:8px">
      <label style="grid-column:1/-1">URL直接指定（任意。RTSP URL または画像ファイル/フォルダのパス。指定時はIP等より優先）<input id="f_url"></label>
    </div>
  </details>
  <p class="small muted">Tapo アプリ → カメラ設定 → 高度な設定 → カメラのアカウント で作成したユーザー名/パスワードを入力します（TP-Link ID ではありません）。パスワードは Windows 資格情報マネージャーに保存されます。</p>
  <div class="row">
    <label class="inline"><input type="checkbox" id="f_enabled" checked> 記録を有効にする</label>
    <span class="spacer"></span>
    <button id="test">接続テスト</button>
    <button id="cancel">キャンセル</button>
    <button class="primary" id="save">保存</button>
  </div>
  <div id="testresult" style="margin-top:12px"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let editing = null;
const F = ["name", "host", "port", "stream", "username", "password", "url"];
async function load() {
  const cams = await api("GET", "/api/cameras");
  document.getElementById("list").innerHTML = cams.map(c => `<div class="card">
    <div class="row"><strong>${esc(c.name)}</strong><span class="spacer"></span>
      ${c.enabled ? "" : '<span class="badge">無効</span>'}
      ${c.calibrated ? '<span class="badge ok">校正済</span>' : '<span class="badge uncalibrated">未校正</span>'}</div>
    <div class="small muted" style="margin:8px 0">${esc(c.url || `${c.host}:${c.port}/${c.stream}`)}${c.has_password ? "" : " ・パスワード未設定"}</div>
    <div class="row">
      <a class="btn primary" href="/calibrate/${c.id}">校正</a>
      <button data-edit="${c.id}">編集</button>
      <button class="danger" data-del="${c.id}">削除</button>
    </div></div>`).join("") || `<div class="card muted">カメラが登録されていません。</div>`;
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openForm(cams.find(c => c.id == b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const c = cams.find(c => c.id == b.dataset.del);
    if (!confirm(`「${c.name}」を削除しますか？記録データもすべて削除されます。`)) return;
    await api("DELETE", `/api/cameras/${c.id}`); toast("削除しました"); load();
  });
}
function openForm(c) {
  editing = c || null;
  document.getElementById("formtitle").textContent = c ? `「${c.name}」を編集` : "カメラを追加";
  F.forEach(k => document.getElementById("f_" + k).value = c ? (c[k] ?? "") : (k === "port" ? 554 : k === "stream" ? "stream1" : ""));
  document.getElementById("f_password").value = "";
  document.getElementById("f_enabled").checked = c ? !!c.enabled : true;
  document.getElementById("testresult").innerHTML = "";
  document.getElementById("formcard").style.display = "block";
  document.getElementById("formcard").scrollIntoView({ behavior: "smooth" });
}
function formData() {
  const d = {}; F.forEach(k => d[k] = document.getElementById("f_" + k).value);
  d.enabled = document.getElementById("f_enabled").checked;
  if (editing) d.id = editing.id;
  return d;
}
document.getElementById("add").onclick = () => openForm(null);
document.getElementById("cancel").onclick = () => document.getElementById("formcard").style.display = "none";
document.getElementById("test").onclick = async e => {
  const out = document.getElementById("testresult");
  e.target.disabled = true; out.innerHTML = '<span class="muted">接続中…（最大15秒）</span>';
  try {
    const r = await api("POST", "/api/cameras/test", formData());
    out.innerHTML = r.ok ? `<div class="small" style="margin-bottom:6px">接続成功: ${r.width}×${r.height}（${r.elapsed}秒）</div><img class="thumb" src="${r.image}">`
      : `<div class="alert bad">接続失敗: ${esc(r.error)}</div>`;
  } catch (err) { out.innerHTML = `<div class="alert bad">${esc(err.message)}</div>`; }
  e.target.disabled = false;
};
document.getElementById("save").onclick = async () => {
  try {
    const d = formData();
    const c = editing ? await api("PUT", `/api/cameras/${editing.id}`, d) : await api("POST", "/api/cameras", d);
    toast("保存しました");
    document.getElementById("formcard").style.display = "none";
    await load();
    if (!editing && confirm("続けて校正を行いますか？")) location.href = `/calibrate/${c.id}`;
  } catch (err) { toast("エラー: " + err.message); }
};
load();
</script>
{% endblock %}
