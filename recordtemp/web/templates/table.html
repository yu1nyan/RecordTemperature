{% extends "base.html" %}
{% block content %}
<h1>記録一覧</h1>
<div class="card">
  <div class="row">
    <label>カメラ<select id="cam"><option value="">すべて</option></select></label>
    <label>開始<input type="datetime-local" id="from"></label>
    <label>終了<input type="datetime-local" id="to"></label>
    <label>状態<select id="status">
      <option value="ok,manual">正常のみ</option>
      <option value="">すべて</option>
      <option value="low_conf,invalid,capture_error,uncalibrated">失敗のみ</option>
    </select></label>
    <label>&nbsp;<button class="primary" id="go">表示</button></label>
    <span class="spacer"></span>
    <label>&nbsp;<a class="btn" id="csv" href="#">CSV ダウンロード</a></label>
  </div>
</div>
<div class="card">
  <div class="table-wrap"><table>
    <thead><tr><th>日時</th><th>カメラ</th><th>温度(℃)</th><th>湿度(%)</th><th>状態</th><th>信頼度</th><th>読取文字</th><th>備考</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="row" style="margin-top:12px">
    <button id="prev">← 前</button><span id="pageinfo" class="muted"></span><button id="next">次 →</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let page = 1, total = 0, perPage = 100, names = {};
function params() {
  const cam = document.getElementById("cam").value;
  return `camera_ids=${cam}&start=${fromLocalInput(document.getElementById("from").value) || ""}` +
    `&end=${fromLocalInput(document.getElementById("to").value) || ""}`;
}
async function load() {
  const st = document.getElementById("status").value;
  const d = await api("GET", `/api/table?${params()}&status=${st}&page=${page}&per_page=${perPage}`);
  total = d.total;
  document.getElementById("rows").innerHTML = d.rows.map(r => `<tr>
    <td>${fmtTime(r.ts, true)}</td><td>${esc(names[r.camera_id] || r.camera_id)}</td>
    <td class="num">${fmtNum(r.temperature)}</td><td class="num">${fmtNum(r.humidity, 0)}</td>
    <td>${badge(r.status)}</td><td class="num">${r.confidence === null ? "" : r.confidence.toFixed(2)}</td>
    <td class="small muted">${esc(r.raw_text || "")}</td>
    <td class="small muted">${r.image_url ? `<a href="${r.image_url}" target="_blank">画像</a> ` : ""}${esc(r.message || "")}</td></tr>`).join("")
    || `<tr><td colspan="8" class="muted">記録がありません</td></tr>`;
  const pages = Math.max(1, Math.ceil(total / perPage));
  document.getElementById("pageinfo").textContent = `${page} / ${pages} ページ（${total} 件）`;
  document.getElementById("prev").disabled = page <= 1;
  document.getElementById("next").disabled = page >= pages;
  document.getElementById("csv").href = `/api/readings.csv?${params()}&all_status=${st === "ok,manual" ? 0 : 1}`;
}
(async () => {
  const cams = await api("GET", "/api/cameras");
  cams.forEach(c => { names[c.id] = c.name; document.getElementById("cam").insertAdjacentHTML("beforeend", `<option value="${c.id}">${esc(c.name)}</option>`); });
  const now = Math.floor(Date.now() / 1000);
  document.getElementById("from").value = toLocalInput(now - 86400);
  document.getElementById("to").value = toLocalInput(now + 60);
  document.getElementById("go").onclick = () => { page = 1; load(); };
  document.getElementById("prev").onclick = () => { page--; load(); };
  document.getElementById("next").onclick = () => { page++; load(); };
  load();
})();
</script>
{% endblock %}
